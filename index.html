<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Davao Bus NearMe</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map"></div>
    <div class="ui-container">
        <div class="status-card">
            <div id="loader" class="spinner"></div>
            <div id="bus-id"><b>Tracker:</b> Ready</div>
            <div id="nearest-info">Select a route to begin</div>
        </div>
        <div id="route-list"></div>
        <div class="privacy-note"><b>Privacy Note:</b> Your location is processed locally. No data is saved or transmitted.</div>
        <div class="credits-link" style="text-align: center; font-size: 10px; margin-top: 10px; opacity: 0.7;">
            Data Source Credits: <a href="CREDITS.md" target="_blank" style="color: inherit;">View Contributors</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/MapManager.js"></script>
    <script src="js/RouteManager.js"></script>
    <script src="js/app.js"></script> 
</body>
</html>
