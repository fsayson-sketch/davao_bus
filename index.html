<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bus Tracker Pro - DB NearMe</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map"></div>

    <div class="ui-container">
        <div class="status-card">
            <div id="loader" class="spinner"></div>
            <div id="bus-id"><b>Tracker:</b> Ready</div>
            <div id="nearest-info">Select a route to begin</div>
        </div>
        <div id="route-list">
            </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/MapManager.js"></script>
    <script src="js/RouteManager.js"></script>
    
    <script>
        // Main Application Logic
        const mapManager = new MapManager('map', [7.0650, 125.5700]);
        let routeManager;

        async function init() {
            try {
                const response = await fetch('routes.json');
                const data = await response.json();
                routeManager = new RouteManager(data.stations, data.all_routes);
                renderUI(data.all_routes);
            } catch (err) {
                console.error("Initialization failed:", err);
            }
        }

        function renderUI(routes) {
            const list = document.getElementById('route-list');
            const groups = [...new Set(routes.map(r => r.id.split('-')[0]))];
            
            groups.forEach(groupId => {
                const am = routeManager.getRouteById(`${groupId}-AM`);
                const pm = routeManager.getRouteById(`${groupId}-PM`);

                if (am || pm) {
                    list.innerHTML += `
                        <div class="route-group-box">
                            <div class="main-route-header" onclick="toggleSubCards('${groupId}')">
                                <span>ROUTE ${groupId.replace('R','')}</span>
                                <svg id="icon-${groupId}" class="arrow-icon" viewBox="0 0 20 20">
                                    <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
                                </svg>
                            </div>
                            <div class="sub-cards-container" id="container-${groupId}">
                                ${am ? renderTripCard(am, '☀️') : ''}
                                ${pm ? renderTripCard(pm, '🌙') : ''}
                            </div>
                        </div>`;
                }
            });
        }

        function renderTripCard(route, emoji) {
            return `
                <div class="route-card" onclick="handleSelect('${route.id}')">
                    <div><span class="route-id">${route.id}</span> <span class="route-name">${route.name}</span></div>
                    <div class="schedule-box">
                        <div class="time-badge">${emoji} ${emoji === '☀️' ? route.am : route.pm}</div>
                    </div>
                </div>`;
        }

        function handleSelect(routeId) {
            const route = routeManager.getRouteById(routeId);
            const coords = route.path.map(name => routeManager.stations[name]);
            
            mapManager.drawRoute(coords, route.path);
            
            document.getElementById('loader').style.display = "block";
            document.getElementById('bus-id').innerHTML = `<b>Selected:</b> ${route.id}`;

            navigator.geolocation.getCurrentPosition(pos => {
                const nearest = routeManager.findNearestStation(pos.coords.latitude, pos.coords.longitude, route.path);
                mapManager.updateUserLocation(pos.coords.latitude, pos.coords.longitude, nearest);
                
                document.getElementById('nearest-info').innerHTML = `Nearest: <b>${nearest.name}</b> (${nearest.distance.toFixed(2)} km)`;
                document.getElementById('loader').style.display = "none";
            }, () => {
                document.getElementById('loader').style.display = "none";
                document.getElementById('nearest-info').innerText = "Location access denied. (Pls. Try Again)";
            }, { enableHighAccuracy: false, timeout: 5000 });
        }

        function toggleSubCards(id) {
            const container = document.getElementById('container-' + id);
            const icon = document.getElementById('icon-' + id);
            const isOpen = container.style.display === "block";
            container.style.display = isOpen ? "none" : "block";
            icon.classList.toggle("rotate-180", !isOpen);
        }

        init();
    </script>
</body>
</html>
